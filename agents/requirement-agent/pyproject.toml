[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "requirement-agent"
version = "0.1.0"
description = "VibeOS Requirement Agent – analyzes and structures project requirements"
requires-python = ">=3.12"
dependencies = [
    "vibeos-agent",
    "fastapi",
    "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["req_agent"]
