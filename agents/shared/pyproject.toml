[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibeos-agent"
version = "0.1.0"
description = "VibeOS Agent Framework – shared base for all domain agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx",
    "redis[hiredis]",
]

[project.optional-dependencies]
gitlab = ["python-gitlab"]
feishu = ["lark-oapi"]
tools = ["python-gitlab", "lark-oapi"]
dev = ["pytest", "pytest-asyncio", "ruff"]
