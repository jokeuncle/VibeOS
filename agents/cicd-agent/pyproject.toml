[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cicd-agent"
version = "0.1.0"
description = "VibeOS CI/CD Agent – designs pipelines, deployment strategies, and infrastructure"
requires-python = ">=3.12"
dependencies = [
    "vibeos-agent",
    "fastapi",
    "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["cicd_agent"]
