[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "architecture-agent"
version = "0.1.0"
description = "VibeOS Architecture Agent – designs systems, schemas, and APIs"
requires-python = ">=3.12"
dependencies = [
    "vibeos-agent",
    "fastapi",
    "uvicorn[standard]",
]

[tool.uv.sources]
vibeos-agent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["architecture_agent"]
