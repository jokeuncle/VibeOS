[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm-agent"
version = "0.1.0"
description = "VibeOS PM Agent – orchestrator that routes work to domain agents"
requires-python = ">=3.12"
dependencies = [
    "vibeos-agent",
    "fastapi",
    "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["pm_agent"]
