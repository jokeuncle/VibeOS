[project]
name = "rag-pipeline"
version = "0.1.0"
description = "VibeOS RAG Pipeline - LlamaIndex + Qdrant retrieval-augmented generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "fastembed>=0.5.0",
    "llama-index-core",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-fastembed",
    "llama-index-llms-openai",
    "pydantic>=2.0",
    "qdrant-client>=1.12.0",
    "redis>=5.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100
